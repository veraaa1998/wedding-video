<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>婚禮影片播放清單</title>
<style>
  :root {
    --sky: #dcebf7;
    --sky-2: #eef5fa;
    --pearl: #fbfaf7;
    --blush: #f7e6ea;
    --champagne: #cdb083;
    --champagne-soft: rgba(205, 176, 131, 0.45);
    --champagne-line: rgba(205, 176, 131, 0.38);
    --ink: #35566e;
    --ink-soft: #7a8d9c;
  }

  * { box-sizing: border-box; }

  html { height: 100%; }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background:
      linear-gradient(180deg, var(--sky) 0%, #e3eef8 22%, var(--sky-2) 46%,
                      #f6f7f6 70%, var(--pearl) 88%, #fdfaf6 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Noto Serif TC", "Source Han Serif TC", "Songti TC",
                 "PMingLiU", "新細明體", "Times New Roman", Georgia, serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== 動態背景 ===== */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  /* 緩慢流動的柔光漸層 */
  .aurora {
    position: absolute;
    inset: -12%;
    background:
      radial-gradient(42% 38% at 16% 14%, rgba(247, 214, 226, 0.62) 0%, rgba(247, 214, 226, 0) 68%),
      radial-gradient(40% 36% at 86% 10%, rgba(234, 215, 178, 0.55) 0%, rgba(234, 215, 178, 0) 68%),
      radial-gradient(50% 42% at 50% 88%, rgba(178, 214, 238, 0.55) 0%, rgba(178, 214, 238, 0) 70%),
      radial-gradient(34% 30% at 74% 56%, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 72%);
    filter: blur(46px);
    animation: auroraFloat 48s ease-in-out infinite alternate;
  }

  @keyframes auroraFloat {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    50%  { transform: translate3d(2.2%, -1.6%, 0) scale(1.05); }
    100% { transform: translate3d(-1.8%, 1.4%, 0) scale(1.02); }
  }

  /* 柔光流光 */
  .shimmer {
    position: absolute;
    inset: 0;
    background: linear-gradient(112deg,
      rgba(255, 255, 255, 0) 38%,
      rgba(255, 255, 255, 0.42) 50%,
      rgba(236, 222, 198, 0.28) 58%,
      rgba(255, 255, 255, 0) 70%);
    background-size: 260% 260%;
    mix-blend-mode: screen;
    opacity: .75;
    animation: shimmerMove 34s linear infinite;
  }

  @keyframes shimmerMove {
    0%   { background-position: -60% 0%; }
    100% { background-position: 160% 100%; }
  }

  /* 柔焦漂浮光點（bokeh） */
  .bokeh span {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 32%,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(255, 255, 255, 0.35) 46%,
      rgba(255, 255, 255, 0) 72%);
    box-shadow: 0 0 18px rgba(255, 255, 255, 0.55);
    animation: bokehFloat ease-in-out infinite alternate;
  }

  @keyframes bokehFloat {
    0%   { transform: translate3d(0, 14px, 0) scale(0.94); opacity: .34; }
    100% { transform: translate3d(10px, -22px, 0) scale(1.08); opacity: .78; }
  }

  .bokeh span:nth-child(1)  { left: 6%;  top: 66%; width: 18px; height: 18px; animation-duration: 27s; animation-delay: -2s; }
  .bokeh span:nth-child(2)  { left: 18%; top: 28%; width: 11px; height: 11px; animation-duration: 34s; animation-delay: -9s; }
  .bokeh span:nth-child(3)  { left: 30%; top: 80%; width: 24px; height: 24px; animation-duration: 31s; animation-delay: -15s; }
  .bokeh span:nth-child(4)  { left: 44%; top: 16%; width: 13px; height: 13px; animation-duration: 39s; animation-delay: -5s; }
  .bokeh span:nth-child(5)  { left: 56%; top: 60%; width: 20px; height: 20px; animation-duration: 29s; animation-delay: -19s; }
  .bokeh span:nth-child(6)  { left: 68%; top: 34%; width: 10px; height: 10px; animation-duration: 36s; animation-delay: -11s; }
  .bokeh span:nth-child(7)  { left: 78%; top: 74%; width: 22px; height: 22px; animation-duration: 33s; animation-delay: -23s; }
  .bokeh span:nth-child(8)  { left: 88%; top: 20%; width: 14px; height: 14px; animation-duration: 38s; animation-delay: -7s; }
  .bokeh span:nth-child(9)  { left: 12%; top: 46%; width: 9px;  height: 9px;  animation-duration: 43s; animation-delay: -27s; }
  .bokeh span:nth-child(10) { left: 92%; top: 56%; width: 16px; height: 16px; animation-duration: 30s; animation-delay: -13s; }

  /* 輕盈飄落花瓣 */
  .petals span {
    position: absolute;
    top: -6%;
    width: 13px;
    height: 13px;
    border-radius: 62% 8% 62% 8%;
    background: linear-gradient(150deg,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(247, 220, 229, 0.8) 55%,
      rgba(233, 203, 214, 0.7) 100%);
    box-shadow: 0 0 8px rgba(240, 210, 220, 0.45);
    opacity: 0;
    animation: petalFall linear infinite;
  }

  @keyframes petalFall {
    0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: .62; }
    50%  { transform: translate3d(30px, 48vh, 0) rotate(180deg); }
    90%  { opacity: .5; }
    100% { transform: translate3d(-12px, 112vh, 0) rotate(360deg); opacity: 0; }
  }

  .petals span:nth-child(1) { left: 9%;  width: 12px; height: 12px; animation-duration: 27s; animation-delay: -3s; }
  .petals span:nth-child(2) { left: 23%; width: 16px; height: 16px; animation-duration: 35s; animation-delay: -13s; }
  .petals span:nth-child(3) { left: 37%; width: 10px; height: 10px; animation-duration: 31s; animation-delay: -21s; }
  .petals span:nth-child(4) { left: 51%; width: 14px; height: 14px; animation-duration: 39s; animation-delay: -7s; }
  .petals span:nth-child(5) { left: 63%; width: 12px; height: 12px; animation-duration: 29s; animation-delay: -17s; }
  .petals span:nth-child(6) { left: 76%; width: 15px; height: 15px; animation-duration: 37s; animation-delay: -25s; }
  .petals span:nth-child(7) { left: 88%; width: 11px; height: 11px; animation-duration: 33s; animation-delay: -9s; }
  .petals span:nth-child(8) { left: 32%; width: 9px;  height: 9px;  animation-duration: 44s; animation-delay: -31s; }
  .petals span:nth-child(9) { left: 70%; width: 13px; height: 13px; animation-duration: 41s; animation-delay: -19s; }

  /* ===== 內容 ===== */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 660px;
    margin: 0 auto;
    padding: 30px 22px 74px;
  }

  /* 標題區塊：喜帖感的細金邊框 */
  header {
    position: relative;
    text-align: center;
    margin-bottom: 26px;
    padding: 40px 26px 34px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.34));
    border: 1px solid var(--champagne-line);
    border-radius: 4px;
    box-shadow: 0 18px 44px rgba(120, 152, 178, 0.16),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    backdrop-filter: blur(8px) saturate(115%);
    -webkit-backdrop-filter: blur(8px) saturate(115%);
  }

  header::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(205, 176, 131, 0.26);
    border-radius: 2px;
    pointer-events: none;
  }

  .ornament {
    display: block;
    color: var(--champagne);
    font-size: 12px;
    letter-spacing: 8px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: clamp(27px, 7vw, 38px);
    font-weight: 600;
    letter-spacing: 7px;
    line-height: 1.42;
    margin: 0 0 14px;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8),
                 0 10px 26px rgba(110, 150, 180, 0.16);
  }

  .rule {
    width: 132px;
    height: 1px;
    margin: 0 auto 16px;
    background: linear-gradient(90deg,
      rgba(205, 176, 131, 0) 0%,
      var(--champagne) 50%,
      rgba(205, 176, 131, 0) 100%);
  }

  .subtitle {
    margin: 0;
    font-size: clamp(15px, 3.9vw, 17px);
    font-weight: 500;
    letter-spacing: 2.5px;
    color: var(--ink-soft);
  }

  /* 卡片清單：縱向單欄 */
  .list-label {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 6px;
    color: #9aa9b4;
    margin: 0 0 16px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* 珍珠白半透明卡片＋細金邊 */
  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 24px 26px;
    overflow: hidden;
    background: linear-gradient(150deg,
      rgba(255, 255, 255, 0.78) 0%,
      rgba(255, 255, 255, 0.58) 48%,
      rgba(251, 246, 240, 0.62) 100%);
    border: 1px solid var(--champagne-line);
    border-radius: 20px;
    box-shadow: 0 16px 38px rgba(118, 152, 180, 0.16),
                0 0 0 1px rgba(255, 255, 255, 0.55) inset;
    backdrop-filter: blur(10px) saturate(118%);
    -webkit-backdrop-filter: blur(10px) saturate(118%);
    text-decoration: none;
    color: inherit;
    transition: transform .35s cubic-bezier(.22, .61, .36, 1),
                box-shadow .35s ease, border-color .35s ease;
  }

  /* 內層細金線，營造雙框質感 */
  .card::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(205, 176, 131, 0.22);
    border-radius: 14px;
    pointer-events: none;
  }

  /* 懸停時的柔光掃過 */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(112deg,
      rgba(255, 255, 255, 0) 34%,
      rgba(255, 255, 255, 0.58) 50%,
      rgba(238, 224, 200, 0.34) 58%,
      rgba(255, 255, 255, 0) 72%);
    transform: translateX(-130%);
    transition: transform 1s ease;
    pointer-events: none;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(205, 176, 131, 0.7);
    box-shadow: 0 22px 50px rgba(118, 152, 180, 0.24),
                0 0 0 1px rgba(255, 255, 255, 0.7) inset;
  }

  .card:hover::after { transform: translateX(130%); }

  .card:focus-visible {
    outline: 2px solid var(--champagne);
    outline-offset: 4px;
  }

  /* 編號：細金環 */
  .badge {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 1px;
    color: #b08f57;
    background: radial-gradient(circle at 34% 30%,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(252, 248, 240, 0.72) 62%,
      rgba(240, 231, 214, 0.6) 100%);
    border: 1px solid rgba(205, 176, 131, 0.55);
    box-shadow: 0 6px 18px rgba(180, 150, 105, 0.2),
                0 0 0 5px rgba(255, 255, 255, 0.42);
  }

  .meta { position: relative; z-index: 1; flex: 1 1 auto; min-width: 0; }

  .meta .name {
    display: block;
    font-size: clamp(21px, 5vw, 25px);
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .meta .hint {
    display: block;
    font-size: clamp(13px, 3.5vw, 14px);
    font-weight: 500;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
  }

  .go {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    font-size: 18px;
    color: var(--champagne);
    transition: transform .35s ease, color .35s ease;
  }

  .card:hover .go { transform: translateX(5px); color: #b08f57; }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    color: #9aa9b4;
  }

  /* 手機版：簡化動效以保效能 */
  @media (max-width: 640px) {
    .bokeh span:nth-child(n+7) { display: none; }
    .petals span:nth-child(n+6) { display: none; }
    .aurora { filter: blur(34px); animation-duration: 60s; }
    .shimmer { animation-duration: 46s; }
  }

  @media (max-width: 480px) {
    .wrap { padding: 20px 16px 56px; }
    header { padding: 32px 18px 26px; margin-bottom: 20px; }
    h1 { letter-spacing: 5px; }
    .card { padding: 20px 18px; gap: 16px; border-radius: 18px; }
    .badge { width: 48px; height: 48px; font-size: 15px; }
    .list { gap: 14px; }
  }

  /* 使用者偏好減少動態時，停止所有動畫 */
  @media (prefers-reduced-motion: reduce) {
    .aurora,
    .shimmer,
    .bokeh span,
    .petals span,
    .card::after {
      animation: none !important;
      transition: none !important;
    }
    .shimmer { opacity: .35; }
    .bokeh span { opacity: .4; }
    .petals span { opacity: .3; transform: translate3d(0, 40vh, 0) rotate(120deg); }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="aurora"></div>
    <div class="shimmer"></div>
    <div class="bokeh">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="petals">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="wrap">
    <header>
      <span class="ornament">&#10022; &#10022; &#10022;</span>
      <h1>婚禮影片播放清單</h1>
      <div class="rule"></div>
      <p class="subtitle">點選下方片段，將前往 YouTube 觀看</p>
    </header>

    <p class="list-label">依儀式順序排列</p>

    <nav class="list">
      <a class="card"
         href="https://www.youtube.com/watch?v=sAHavu_9s_M"
         target="_blank" rel="noopener noreferrer">
        <span class="badge" aria-hidden="true">01</span>
        <span class="meta">
          <span class="name">文定儀式</span>
          <span class="hint">點選前往 YouTube 觀看</span>
        </span>
        <span class="go" aria-hidden="true">&#8599;</span>
      </a>

      <a class="card"
         href="https://www.youtube.com/watch?v=GEEoMtQZGVU"
         target="_blank" rel="noopener noreferrer">
        <span class="badge" aria-hidden="true">02</span>
        <span class="meta">
          <span class="name">迎娶儀式</span>
          <span class="hint">點選前往 YouTube 觀看</span>
        </span>
        <span class="go" aria-hidden="true">&#8599;</span>
      </a>

      <a class="card"
         href="https://www.youtube.com/watch?v=6OZjZRTx6DM"
         target="_blank" rel="noopener noreferrer">
        <span class="badge" aria-hidden="true">03</span>
        <span class="meta">
          <span class="name">宴客(上)</span>
          <span class="hint">點選前往 YouTube 觀看</span>
        </span>
        <span class="go" aria-hidden="true">&#8599;</span>
      </a>

      <a class="card"
         href="https://www.youtube.com/watch?v=iGWsJ6P2vn4"
         target="_blank" rel="noopener noreferrer">
        <span class="badge" aria-hidden="true">04</span>
        <span class="meta">
          <span class="name">宴客(下)</span>
          <span class="hint">點選前往 YouTube 觀看</span>
        </span>
        <span class="go" aria-hidden="true">&#8599;</span>
      </a>
    </nav>

    <footer>共 4 段影片 · 點選卡片即於新分頁開啟</footer>
  </div>
</body>
</html>
